.pc::before{content:"";position:absolute;top:-50px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(211,171,43,.38),transparent 65%);animation:breathe 2.2s ease-in-out infinite}

const cv=$("#cv"),cx=cv.getContext("2d"),track=$("#track"),bar=$("#bar"),imgs=[];let cur=0,target=0,shown=-1;
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
for(let i=1;i<=CONFIG.frames;i++){const im=new Image();im.src=CONFIG.framePath(i);imgs.push(im);}
function size(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;shown=-1}
function draw(i){const im=imgs[i];if(!im||!im.complete||!im.naturalWidth)return;
cx.clearRect(0,0,cv.width,cv.height);
if(innerWidth<800){const h=cv.height*(innerHeight<700?.46:.5),sh=im.naturalHeight,sw=Math.min(im.naturalWidth,sh*cv.width/h);cx.drawImage(im,(im.naturalWidth-sw)*.62,0,sw,sh,0,0,cv.width,h)}
else{const r=Math.max(cv.width/im.naturalWidth,cv.height/im.naturalHeight),w=im.naturalWidth*r,h=im.naturalHeight*r;cx.drawImage(im,(cv.width-w)/2,(cv.height-h)/2,w,h)}
shown=i}
function tick(){const max=track.offsetHeight-innerHeight,p=Math.min(Math.max(-track.getBoundingClientRect().top/max,0),1);
target=still?0:p*(CONFIG.frames-1);cur+=(target-cur)*.12;const i=Math.round(cur);if(i!==shown)draw(i);bar.style.width=p*100+"%";requestAnimationFrame(tick)}
(function(){const need=Math.min(12,CONFIG.frames),t0=performance.now();let pv=0;
function pl(){const el=performance.now()-t0,real=el>5000?1:imgs.slice(0,need).filter(i=>i.complete&&i.naturalWidth).length/need,v=Math.min(real,el/1900);
pv+=(v-pv)*.14;$("#pb").style.width=pv*100+"%";$("#pn").textContent=Math.round(pv*100);
if(pv>.985){$("#pb").style.width="100%";$("#pn").textContent=100;setTimeout(()=>{$("#pre").classList.add("done");setTimeout(()=>document.body.classList.add("go"),550)},250)}else requestAnimationFrame(pl)}pl()})();
addEventListener("resize",size);size();imgs[0].onload=()=>draw(0);tick();

function rv(){document.querySelectorAll(".rv:not(.in)").forEach(e=>io?io.observe(e):e.classList.add("in"))}
